<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Cosmos Sandbox thumbnail: a star, orbiting planets and a black hole">
  <defs>
    <radialGradient id="space" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0" stop-color="#1d0f33"/>
      <stop offset="1" stop-color="#06060a"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="0.45" stop-color="#f3d77e"/>
      <stop offset="1" stop-color="#e5ca72" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetA" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#c37bff"/>
      <stop offset="1" stop-color="#4a0a80"/>
    </radialGradient>
    <radialGradient id="planetB" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#7fd6ff"/>
      <stop offset="1" stop-color="#1c4d7a"/>
    </radialGradient>
    <radialGradient id="disk" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.35" stop-color="#000"/>
      <stop offset="0.5" stop-color="#ffcf6b"/>
      <stop offset="0.75" stop-color="#b14be0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#b14be0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="300" fill="url(#space)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="30" cy="30" r="1.4"/><circle cx="80" cy="260" r="1"/><circle cx="140" cy="40" r="1.2"/>
    <circle cx="210" cy="275" r="1.4"/><circle cx="300" cy="22" r="1"/><circle cx="455" cy="60" r="1.5"/>
    <circle cx="440" cy="280" r="1.1"/><circle cx="20" cy="160" r="1"/><circle cx="380" cy="150" r="0.9"/>
    <circle cx="260" cy="120" r="0.8"/><circle cx="110" cy="140" r="0.9"/><circle cx="460" cy="190" r="1"/>
  </g>
  <g fill="#e5ca72"><circle cx="60" cy="90" r="1.6"/><circle cx="330" cy="270" r="1.4"/><circle cx="420" cy="18" r="1.3"/></g>
  <!-- orbits -->
  <g fill="none" stroke="#e5ca72" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 6">
    <ellipse cx="170" cy="155" rx="80" ry="32"/>
    <ellipse cx="170" cy="155" rx="140" ry="58"/>
  </g>
  <!-- sun -->
  <circle cx="170" cy="155" r="58" fill="url(#sun)"/>
  <circle cx="170" cy="155" r="24" fill="#fff3c4"/>
  <!-- planets -->
  <circle cx="246" cy="145" r="13" fill="url(#planetB)"/>
  <circle cx="58" cy="190" r="20" fill="url(#planetA)"/>
  <ellipse cx="58" cy="190" rx="32" ry="7" fill="none" stroke="#e5ca72" stroke-width="2.5" transform="rotate(-18 58 190)"/>
  <!-- black hole -->
  <g transform="translate(375 110)">
    <ellipse rx="92" ry="26" fill="url(#disk)" transform="rotate(-14)"/>
    <circle r="30" fill="#000"/>
    <circle r="31" fill="none" stroke="#ffcf6b" stroke-width="2" opacity="0.9"/>
    <path d="M-80 10 Q0 -14 80 -30" stroke="#ffe3a0" stroke-width="3" fill="none" opacity="0.8" transform="rotate(-2)"/>
  </g>
  <!-- placement cursor -->
  <g transform="translate(350 230)" stroke="#9419ec" stroke-width="3" fill="none">
    <circle r="16" stroke-dasharray="5 4"/>
    <line x1="-26" y1="0" x2="-20" y2="0"/><line x1="20" y1="0" x2="26" y2="0"/>
    <line x1="0" y1="-26" x2="0" y2="-20"/><line x1="0" y1="20" x2="0" y2="26"/>
  </g>
  <text x="378" y="262" font-family="Courier New, monospace" font-size="13" fill="#e5ca72" font-weight="bold">+ PLANET</text>
</svg>
