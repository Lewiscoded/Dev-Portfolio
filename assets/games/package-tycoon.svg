<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Package Tycoon thumbnail: boxes riding a conveyor belt">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1747"/>
      <stop offset="1" stop-color="#4b2378"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1d5e"/>
      <stop offset="1" stop-color="#1a1023"/>
    </linearGradient>
    <linearGradient id="belt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b30"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#sky)"/>
  <!-- warehouse shelves -->
  <g opacity="0.35" fill="#e5ca72">
    <rect x="20" y="40" width="120" height="6"/><rect x="20" y="85" width="120" height="6"/>
    <rect x="340" y="40" width="120" height="6"/><rect x="340" y="85" width="120" height="6"/>
  </g>
  <g fill="#c48a3a" opacity="0.5">
    <rect x="30" y="18" width="26" height="22"/><rect x="62" y="24" width="20" height="16"/><rect x="100" y="14" width="30" height="26"/>
    <rect x="350" y="20" width="24" height="20"/><rect x="384" y="12" width="32" height="28"/><rect x="424" y="22" width="22" height="18"/>
    <rect x="36" y="63" width="28" height="22"/><rect x="88" y="67" width="22" height="18"/>
    <rect x="360" y="65" width="26" height="20"/><rect x="410" y="61" width="30" height="24"/>
  </g>
  <rect y="190" width="480" height="110" fill="url(#floor)"/>
  <!-- conveyor -->
  <rect x="-10" y="170" width="500" height="34" rx="17" fill="url(#belt)" stroke="#e5ca72" stroke-width="3"/>
  <g fill="#e5ca72">
    <circle cx="30" cy="187" r="9"/><circle cx="110" cy="187" r="9"/><circle cx="190" cy="187" r="9"/>
    <circle cx="270" cy="187" r="9"/><circle cx="350" cy="187" r="9"/><circle cx="430" cy="187" r="9"/>
  </g>
  <g fill="#18181b">
    <circle cx="30" cy="187" r="3"/><circle cx="110" cy="187" r="3"/><circle cx="190" cy="187" r="3"/>
    <circle cx="270" cy="187" r="3"/><circle cx="350" cy="187" r="3"/><circle cx="430" cy="187" r="3"/>
  </g>
  <!-- legs -->
  <g fill="#2b2b30"><rect x="60" y="204" width="10" height="40"/><rect x="230" y="204" width="10" height="40"/><rect x="400" y="204" width="10" height="40"/></g>
  <!-- boxes -->
  <g stroke="#7a4c17" stroke-width="3" stroke-linejoin="round">
    <rect x="40" y="128" width="58" height="44" rx="4" fill="#d9a04f"/>
    <rect x="66" y="128" width="8" height="44" fill="#e5ca72" stroke="none"/>
    <rect x="170" y="110" width="76" height="62" rx="4" fill="#cf9446"/>
    <rect x="202" y="110" width="10" height="62" fill="#e5ca72" stroke="none"/>
    <rect x="310" y="136" width="48" height="36" rx="4" fill="#dcaa5c"/>
    <rect x="330" y="136" width="8" height="36" fill="#e5ca72" stroke="none"/>
  </g>
  <!-- faces (cozy) -->
  <g fill="#3b2410">
    <circle cx="190" cy="140" r="4"/><circle cx="228" cy="140" r="4"/>
    <circle cx="54" cy="152" r="3"/><circle cx="86" cy="152" r="3"/>
  </g>
  <path d="M199 152 q10 9 20 0" stroke="#3b2410" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- motion lines -->
  <g stroke="#e5ca72" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="140" y1="130" x2="160" y2="130"/><line x1="132" y1="145" x2="160" y2="145"/>
    <line x1="270" y1="125" x2="296" y2="125"/><line x1="280" y1="140" x2="300" y2="140"/>
  </g>
  <!-- coins -->
  <g>
    <circle cx="410" cy="132" r="20" fill="#e5ca72" stroke="#a8862b" stroke-width="4"/>
    <text x="410" y="140" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22" fill="#a8862b">$</text>
    <circle cx="444" cy="108" r="12" fill="#e5ca72" stroke="#a8862b" stroke-width="3"/>
  </g>
  <!-- sparkle -->
  <path d="M120 70 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4z" fill="#fff6d0" opacity="0.8"/>
  <path d="M300 60 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3z" fill="#fff6d0" opacity="0.7"/>
  <!-- floor sorting lanes -->
  <g fill="none" stroke="#9419ec" stroke-width="3" opacity="0.55">
    <path d="M90 300 L170 240"/><path d="M240 300 L240 240"/><path d="M390 300 L310 240"/>
  </g>
</svg>
